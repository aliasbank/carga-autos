name: carga-en-orden

services:
  cargadores:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-}
    image: carga-en-orden:local
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8787}:8787"
    environment:
      TZ: America/Mexico_City
      PORT: 8787
      HOST: 0.0.0.0
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_DATA_DIR: /data
      SITES_RUNTIME_ROOT: /data/runtime
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      XDG_DATA_HOME: /tmp/.local/share
      XDG_STATE_HOME: /tmp/.local/state
      QUEUE_AUTOMATION_TOKEN: ${QUEUE_AUTOMATION_TOKEN:?Define QUEUE_AUTOMATION_TOKEN en el archivo .env}
    volumes:
      - carga_en_orden_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      # Wrangler creates its short-lived bundles beside its configuration.
      - /app/dist/server/.wrangler:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL

  queue-automation:
    image: carga-en-orden:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      cargadores:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/node", "scripts/queue-scheduler.mjs"]
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      QUEUE_AUTOMATION_TOKEN: ${QUEUE_AUTOMATION_TOKEN:?Define QUEUE_AUTOMATION_TOKEN en el archivo .env}
      QUEUE_AUTOMATION_INTERVAL_SECONDS: 30
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL

volumes:
  carga_en_orden_data:
